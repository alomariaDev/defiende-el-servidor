seed: 42
experiment_name: defiende-el-servidor
configs:
  - id: lr_c1
    family: logistic_regression
    hypothesis: "Una regresión logística con C=1 y pesos balanceados proporciona la línea base lineal para detectar ataques."
    parameters:
      C: 1.0
      class_weight: balanced
      max_iter: 1500
      solver: lbfgs
  - id: lr_c0_1
    family: logistic_regression
    hypothesis: "Reducir C de 1 a 0.1 aumenta la regularización y podría mejorar la generalización frente a la línea base."
    parameters:
      C: 0.1
      class_weight: balanced
      max_iter: 1500
      solver: lbfgs
  - id: dt_depth5
    family: decision_tree
    hypothesis: "Cambiar de regresión logística a un árbol de decisión con profundidad 5 permite capturar relaciones no lineales controlando complejidad."
    parameters:
      max_depth: 5
      class_weight: balanced
  - id: dt_depth15
    family: decision_tree
    hypothesis: "Aumentar la profundidad máxima de 5 a 15 podría capturar interacciones más complejas, con mayor riesgo de sobreajuste."
    parameters:
      max_depth: 15
      class_weight: balanced
